name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
      - name: Check tag matches project version
        run: |
          version="$(uv version --short)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match version ${version}" >&2
            exit 1
          fi
      - run: uv sync --locked
      - run: uv run pytest
      - run: uv build
      - name: Simulated deploy
        run: |
          echo "Would deploy reservas-demo ${GITHUB_REF_NAME} to production (simulated)."
          ls -l dist/
